# 워크플로우의 이름
name: Deploy Spring Boot to AWS EC2

# 언제 실행할 것인가: 'back' 브랜치에 'push'가 될 때
on:
  push:
    branches:
      - back # (사용 중인 브랜치 이름)

# 어떤 작업을 실행할 것인가
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Add execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean bootJar --no-daemon

      # 5. 빌드가 완료된 .jar 파일을 EC2로 전송
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # (★수정 1/4) 확인된 "진짜" 파일 이름
          source: "build/libs/Gym_PT-0.0.1-SNAPSHOT.jar"
          # (★수정 2/4) Gym-PT-Backend 폴더가 아닌, 홈 디렉토리에 바로 복사
          target: "/home/ec2-user/"

      # 6. EC2 서버에 SSH로 접속해서 재시작 명령어 실행 (★로직 단순화★)
      - name: Restart Server on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. 기존에 실행 중인 서버가 있다면 종료
            # (★수정 3/4) "진짜" 파일 이름으로 실행 중인 프로세스를 찾음
            PID=$(ps -ef | grep 'java -jar Gym_PT-0.0.1-SNAPSHOT.jar' | grep -v grep | awk '{print $2}')
            if [ -n "$PID" ]; then
              kill -9 $PID
              echo "Killed old process $PID"
            fi
            
            # 2. 13개의 환경 변수를 모두 export (Secrets에서 값을 가져옴)
            export SPRING_DATASOURCE_URL='${{ secrets.SPRING_DATASOURCE_URL }}'
            export SPRING_DATASOURCE_USERNAME='${{ secrets.SPRING_DATASOURCE_USERNAME }}'
            export SPRING_DATASOURCE_PASSWORD='${{ secrets.SPRING_DATASOURCE_PASSWORD }}'
            export SPRING_JPA_HIBERNATE_DDL_AUTO='${{ secrets.SPRING_JPA_HIBERNATE_DDL_AUTO }}'
            export SPRING_JACKSON_TIME_ZONE='${{ secrets.SPRING_JACKSON_TIME_ZONE }}'
            export SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE='${{ secrets.SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE }}'
            export SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE='${{ secrets.SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE }}'
            export GPT_API_KEY='${{ secrets.GPT_API_KEY }}'
            export CLOUD_AWS_REGION_STATIC='${{ secrets.CLOUD_AWS_REGION_STATIC }}'
            export CLOUD_AWS_S3_BUCKET='${{ secrets.CLOUD_AWS_S3_BUCKET }}'
            export CLOUD_AWS_CREDENTIALS_ACCESS_KEY='${{ secrets.CLOUD_AWS_CREDENTIALS_ACCESS_KEY }}'
            export CLOUD_AWS_CREDENTIALS_SECRET_KEY='${{ secrets.CLOUD_AWS_CREDENTIALS_SECRET_KEY }}'
            export CLOUD_AWS_CREDENTIALS_USE_DEFAULT_AWS_CREDENTIALS_CHAIN='${{ secrets.CLOUD_AWS_CREDENTIALS_USE_DEFAULT_AWS_CREDENTIALS_CHAIN }}'

            # 3. (★수정 4/4) 
            # /home/ec2-user/ 폴더에서 바로 .jar 파일을 실행 (cd, mv 명령어 모두 삭제)
            nohup java -jar /home/ec2-user/Gym_PT-0.0.1-SNAPSHOT.jar > /home/ec2-user/app.log 2>&1 &
            echo "Server restarted successfully"