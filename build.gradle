plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.Gym_PT'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

configurations {
	// Mockito agent를 주입하기 위한 별도 구성
	mockitoAgent
}

dependencies {
	// --- Spring Starters (Boot가 버전 관리) ---
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// --- DB Drivers ---
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'com.h2database:h2'

	// --- Security / JWT ---
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'com.nimbusds:nimbus-jose-jwt:9.37.3'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly   'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly   'io.jsonwebtoken:jjwt-jackson:0.12.5'

	// --- AWS SDK (수정됨: BOM 제거 및 버전 직접 명시) ---
	implementation 'software.amazon.awssdk:s3:2.25.11'
	implementation 'software.amazon.awssdk:s3-presigner:2.25.11'
	implementation 'software.amazon.awssdk:auth:2.25.11'
	// --- Lombok ---
	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	testCompileOnly 'org.projectlombok:lombok:1.18.30'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

	// --- Test ---
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// --- Mockito (Agent 포함) ---
	testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
	testImplementation 'org.mockito:mockito-core:5.12.0'
	testRuntimeOnly  'org.mockito:mockito-agent:5.12.0'
	mockitoAgent     'org.mockito:mockito-agent:5.12.0'
}

// Mockito agent를 테스트 JVM에 주입
tasks.withType(Test).configureEach {
	useJUnitPlatform()
	jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile}"
}

// 컴파일러에 파라미터 이름 정보 유지(예: @PathVariable 등에서 유용)
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ["-parameters"]
}